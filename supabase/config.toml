project_id = "context-relay"

[api]
schemas = ["public", "graphql_public"]

[db]
major_version = 17

[auth]
jwt_expiry = 900

[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GITHUB_SECRET)"

[storage.buckets.ciphertext]
public = false
file_size_limit = "33554432"

# New publishable/secret API keys are not JWTs. The sync function verifies the
# caller's Supabase Auth access token with auth.getClaims() before any decode,
# trusted-certificate lookup, or service RPC.
[functions.sync]
verify_jwt = false

# New publishable keys are not JWTs. This function validates the caller's
# access token with auth.getClaims() and derives the account only from the
# verified sub/session_id binding before invoking service-only RPCs.
[functions.account-lifecycle]
verify_jwt = false
