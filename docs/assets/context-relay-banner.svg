<text x="64" y="76" font-size="13" font-weight="700" letter-spacing="3" fill="#8de0c6">MEMORY · TASKS · CONTINUITY</text>
<text x="60" y="149" font-size="58" font-weight="700" fill="#f5f7ff">Context Relay</text>
<text x="64" y="194" font-size="25" fill="#c2cde0">Keep context. Change agents.</text>
<text x="64" y="256" font-size="16" fill="#95a9c5">A local encrypted workspace for your coding workflow.</text>
