<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Context Relay — keep context, across coding agents</title>
<desc id="desc">Shared memory and tasks connect Claude Code, Codex, and Hermes through a local encrypted workspace.</desc>
