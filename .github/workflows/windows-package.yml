name: Windows installer candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-package.yml'
      - 'apps/desktop/**'
      - 'crates/**'
      - 'scripts/package-windows*'
      - 'scripts/windows-preview*'
      - 'scripts/windows-installed-smoke*'
      - 'docs/verification/windows-installed-smoke.md'
      - 'scripts/*search-resources*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.node-version'
      - 'LICENSE'
      - 'THIRD_PARTY_NOTICES.md'

permissions:
  contents: read

jobs:
  package:
    name: Windows installer candidate
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: rustup show
      - name: Fetch verified search resources
        shell: pwsh
        run: ./scripts/fetch-search-resources.ps1
      - run: node --test scripts/package-windows.test.mjs scripts/search-resources.test.mjs scripts/windows-preview.test.mjs scripts/windows-installed-smoke.test.mjs
        env:
          CONTEXT_RELAY_SEARCH_ASSETS: ${{ github.workspace }}/target/search-assets
      - run: pnpm package:windows
        env:
          CONTEXT_RELAY_HOSTED_URL: ${{ vars.CONTEXT_RELAY_HOSTED_URL }}
          CONTEXT_RELAY_HOSTED_PUBLISHABLE_KEY: ${{ vars.CONTEXT_RELAY_HOSTED_PUBLISHABLE_KEY }}
      - name: Record candidate provenance and SBOM
        shell: pwsh
        run: |
          $env:PNPM_VERSION = (pnpm --version).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm licenses list --json | Set-Content -LiteralPath target/node-licenses.json -Encoding utf8NoBOM
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm preview:evidence
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CONTEXT_RELAY_HOSTED_URL: ${{ vars.CONTEXT_RELAY_HOSTED_URL }}
          CONTEXT_RELAY_HOSTED_PUBLISHABLE_KEY: ${{ vars.CONTEXT_RELAY_HOSTED_PUBLISHABLE_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: context-relay-windows-x64-${{ github.sha }}
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS
            target/x86_64-pc-windows-msvc/release/bundle/nsis/provenance.json
            target/x86_64-pc-windows-msvc/release/bundle/nsis/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  installed-smoke:
    name: Installed Windows first launch
    needs: package
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: context-relay-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/context-relay-candidate
      - name: Install and exercise the packaged application
        # Windows PowerShell 5.1 provides the normal .NET Framework UI Automation API.
        shell: powershell
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          ./scripts/windows-installed-smoke.ps1 `
            -CandidateDirectory (Join-Path $env:RUNNER_TEMP 'context-relay-candidate') `
            -ExpectedSourceCommit $env:EXPECTED_SOURCE_COMMIT `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'context-relay-installed-evidence')
      - name: Retain bounded installed-smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: context-relay-windows-installed-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context-relay-installed-evidence/installed-smoke.json
          if-no-files-found: warn
          retention-days: 30
