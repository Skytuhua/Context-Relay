name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify secret scan policy contract
        run: node --test scripts/secret-scan-workflow.test.mjs
      - name: Scan every Git ref with pinned Gitleaks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks_8.30.1_windows_x64.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'gitleaks-8.30.1'
          $binary = Join-Path $extract 'gitleaks.exe'
          $ignore = Join-Path $env:GITHUB_WORKSPACE 'third_party/sidecars/policies/repository.gitleaksignore'
          $report = Join-Path $env:RUNNER_TEMP 'gitleaks-report.json'

          Invoke-WebRequest `
            -Uri 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' `
            -OutFile $archive
          if ((Get-Item -LiteralPath $archive).Length -ne 8438883) {
            throw 'Gitleaks archive size mismatch'
          }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd29144deff3a68aa93ced33dddf84b7fdc26070add4aa0f4513094c8332afc4e') {
            throw 'Gitleaks archive digest mismatch'
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $extract
          if ((Get-Item -LiteralPath $binary).Length -ne 22575104) {
            throw 'Gitleaks executable size mismatch'
          }
          if ((Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant() -ne '17157e2ee8b76fc8b1d8bee607a250e34b8a8023c8bc81822d4b5ee4d78fcb7c') {
            throw 'Gitleaks executable digest mismatch'
          }
          if ((Get-Item -LiteralPath $ignore).Length -ne 629) {
            throw 'Gitleaks reviewed-ignore size mismatch'
          }
          if ((Get-FileHash -LiteralPath $ignore -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'd5d44a8d107c0e407ba99ce0e7400b66e6b538de6e3b0c9b4ddbb9f6ab9bccd8') {
            throw 'Gitleaks reviewed-ignore digest mismatch'
          }

          $arguments = @(
            '--no-banner'
            '--no-color'
            '--log-level=error'
            '--redact=100'
            '--exit-code=10'
            '--report-format=json'
            "--report-path=$report"
            "--gitleaks-ignore-path=$ignore"
            '--ignore-gitleaks-allow'
            '--max-target-megabytes=0'
            '--max-archive-depth=0'
            '--max-decode-depth=1'
            '--timeout=30'
            '--diagnostics='
            'git'
            '--log-opts=--all'
            $env:GITHUB_WORKSPACE
          )
          & $binary @arguments *> $null
          $status = $LASTEXITCODE
          if ($status -eq 10) {
            throw 'A potential secret was detected; revoke and rotate it before removing it from Git history'
          }
          if ($status -ne 0) {
            throw "Gitleaks failed with exit code $status"
          }
