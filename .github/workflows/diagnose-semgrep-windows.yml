name: Diagnose Semgrep Windows exception

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: task9-semgrep-windows-build-a-c3a9743012874bea2bb4e1daa4db81c4461852ff-30129619956
          path: ${{ runner.temp }}/context-relay-semgrep-output-windows
          run-id: 30129619956
          github-token: ${{ github.token }}
      - name: Prepare exact reused candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'context-relay-semgrep-output-windows'
          $input = Join-Path $root 'source-a.tar'
          $output = Join-Path $root 'source-a.resealed.tar'
          node --input-type=module -e "import{readFile}from'node:fs/promises';import{resealSemgrepSourceBundle as r}from'./scripts/reseal-semgrep-source-bundle.mjs';const[i,o,l]=process.argv.slice(1);await r({additions:[],inputPath:i,outputPath:o,replacements:[{bytes:await readFile(l),executable:false,path:'metadata/source-lock.v1.json'}]})" $input $output (Resolve-Path third_party/sidecars/semgrep/source-lock.v1.json).Path
          $summary = node --input-type=module -e "import{createHash}from'node:crypto';import{readFile,writeFile}from'node:fs/promises';import{join}from'node:path';import{verifyDeterministicTar as v}from'./scripts/semgrep-source-bundle.mjs';const[t,r]=process.argv.slice(1),h=b=>createHash('sha256').update(b).digest('hex'),p=(...x)=>join(r,...x),lp=p('third_party','sidecars','semgrep','source-lock.v1.json'),pp=p('third_party','sidecars','semgrep','native-ci-provenance.v1.json'),ep=p('third_party','sidecars','semgrep','bundle-evidence.v1.json'),mp=p('third_party','sidecars','manifest.v1.json'),s=await v(t),lb=await readFile(lp),e=JSON.parse(await readFile(ep,'utf8'));e.bundle={payloadEntries:s.payloadEntries,recordedLinks:s.links,sha256:s.sha256,size:s.size};e.sourceLockSha256=h(lb);await writeFile(ep,JSON.stringify(e,null,2)+'\n');const eb=await readFile(ep),pb=await readFile(pp),m=JSON.parse(await readFile(mp,'utf8')),g=m.tools.find(x=>x.id==='semgrep');g.source.materialSha256=h(lb);for(const x of g.materials){if(x.role==='native-ci-provenance')x.sha256=h(pb);if(x.role==='source-bundle-evidence')x.sha256=h(eb)}await writeFile(mp,JSON.stringify(m,null,2)+'\n');console.log(JSON.stringify({sha256:s.sha256,size:s.size,payloadEntries:s.payloadEntries,recordedLinks:s.links}))" $output $env:GITHUB_WORKSPACE
          Write-Host "context-relay-resealed-source=$summary"
          Remove-Item -LiteralPath $input
          Move-Item -LiteralPath $output -Destination $input
          $candidate = Join-Path $env:RUNNER_TEMP 'context-relay-semgrep-candidate-windows'
          $result = node scripts/prepare-semgrep-runtime.mjs --prepare-v1 --workspace $env:GITHUB_WORKSPACE --target windows-x86_64 --build-root $root --output-root $candidate --source-bundle $input --bundle-evidence (Resolve-Path third_party/sidecars/semgrep/bundle-evidence.v1.json).Path | ConvertFrom-Json
          if ($result.mode -ne 'candidate' -or -not $result.candidateWorkspace -or -not $result.candidateDocumentPath) { throw 'candidate preparation failed' }
          "CONTEXT_RELAY_REAL_SIDECAR_MANIFEST_ROOT=$($result.candidateWorkspace)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CONTEXT_RELAY_CI_CANDIDATE_DOCUMENT=$($result.candidateDocumentPath)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "CONTEXT_RELAY_REAL_SIDECAR_ROOT=$($result.hydrationRoot)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run only the exact failing gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $probe = Join-Path $env:RUNNER_TEMP 'context-relay-semgrep-core-probe'
          New-Item -ItemType Directory -Path (Join-Path $probe 'config') | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $probe 'input/semgrep-target') | Out-Null
          $osemgrep = Join-Path $env:CONTEXT_RELAY_REAL_SIDECAR_ROOT 'semgrep/osemgrep.exe'
          $core = Join-Path (Split-Path $osemgrep) 'semgrep-core.exe'
          New-Item -ItemType HardLink -Path $core -Target $osemgrep | Out-Null
          Copy-Item third_party/sidecars/policies/semgrep-package.yml (Join-Path $probe 'config/package.yml')
          @'
          ["Targets",[["CodeTarget",{"path":{"fpath":"input/semgrep-target/runtime-inventory.txt","ppath":"input/semgrep-target/runtime-inventory.txt"},"analyzer":"spacegrep","products":["sast"]}]]]
          '@ | Set-Content (Join-Path $probe 'config/targets.json') -NoNewline
          function Get-CoreErrorLabel($Error) {
            $type = @($Error.error_type)[0]
            switch -Exact ($type) {
              'Lexical error' { 'lexical' }
              'Syntax error' { 'parse' }
              'Other syntax error' { 'other-parse' }
              'AST builder error' { 'ast-builder' }
              'Rule parse error' { 'rule-parse' }
              'SemgrepWarning' { 'semgrep-warning' }
              'SemgrepError' { 'semgrep-error' }
              'InvalidRuleSchemaError' { 'invalid-rule-schema' }
              'UnknownLanguageError' { 'unknown-language' }
              'Invalid YAML' { 'invalid-yaml' }
              'Internal matching error' { 'matching' }
              'Semgrep match found' { 'match-found' }
              'Too many matches' { 'too-many-matches' }
              'Fatal error' { 'fatal' }
              'Timeout' { 'timeout' }
              'Out of memory' { 'out-of-memory' }
              'Fixpoint timeout' { 'fixpoint-timeout' }
              'Stack overflow' { 'stack-overflow' }
              'Timeout during interfile analysis' { 'interfile-timeout' }
              'OOM during interfile analysis' { 'interfile-out-of-memory' }
              'Missing plugin' { 'missing-plugin' }
              'PatternParseError' { 'pattern-parse' }
              'PartialParsing' { 'partial-parsing' }
              'IncompatibleRule' { 'incompatible-rule' }
              'Pattern parse error' { 'pattern-parse-legacy' }
              'Incompatible rule' { 'incompatible-rule-legacy' }
              'DependencyResolutionError' { 'dependency-resolution' }
              default { 'other' }
            }
          }
          function Get-CoreExceptionLabel($Error) {
            $message = if ($Error.message -is [string]) { $Error.message } else { '' }
            switch -Regex ($message) {
              '^Unix_error:' { 'unix-error'; break }
              '^Sys_error' { 'sys-error'; break }
              '^Invalid_argument:' { 'invalid-argument'; break }
              '^Failure:' { 'failure'; break }
              '^Out_of_memory$' { 'out-of-memory'; break }
              '^Stack_overflow$' { 'stack-overflow'; break }
              default { 'other' }
            }
          }
          function Get-CoreOsErrorLabel($Error) {
            $message = if ($Error.message -is [string]) { $Error.message } else { '' }
            if ($message -match '(?i)access is denied') { return 'access-denied' }
            if ($message -match '(?i)permission denied') { return 'permission-denied' }
            if ($message -match '(?i)no such file') { return 'no-such-file' }
            'other'
          }
          function Get-CoreArgumentLabel($Error) {
            $message = if ($Error.message -is [string]) { $Error.message } else { '' }
            if ($message -match '^Invalid_argument:\s*([A-Za-z0-9_.]{1,64})') { return $Matches[1] }
            'none'
          }
          function Invoke-CoreProbe([string] $Content) {
            Set-Content (Join-Path $probe 'input/semgrep-target/runtime-inventory.txt') -Value $Content -NoNewline
            $stdout = Join-Path $probe 'stdout.json'
            $stderr = Join-Path $probe 'stderr.txt'
            $process = Start-Process -FilePath $core -ArgumentList @(
              '-rules', 'config/package.yml',
              '-targets', 'config/targets.json',
              '-json_time',
              '-strict',
              '-j', '1',
              '-use_parmap',
              '-timeout', '0',
              '-timeout_threshold', '1'
            ) -WorkingDirectory $probe -RedirectStandardOutput $stdout -RedirectStandardError $stderr -Wait -PassThru -WindowStyle Hidden
            $report = Get-Content $stdout -Raw | ConvertFrom-Json
            $knownKeys = @('engine_requested','errors','interfile_languages_used','mcp_scan_results','paths','profiling_results','results','rules_by_engine','skipped_rules','subprojects','symbol_analysis','time','version')
            $keys = @($report.PSObject.Properties.Name | Sort-Object)
            $results = if ($report.results -is [array]) { @($report.results) } else { @() }
            $errors = if ($report.errors -is [array]) { @($report.errors) } else { @() }
            $error = if ($errors.Count -eq 1) { $errors[0] } else { $null }
            [ordered]@{
              exit = $process.ExitCode
              json = $null -ne $report
              envelope = (Compare-Object $knownKeys $keys).Count -eq 0
              errors = $errors.Count
              error = if ($errors.Count -eq 0) { 'none' } elseif ($errors.Count -gt 1) { 'multiple' } else { Get-CoreErrorLabel $error }
              exception = if ($null -eq $error) { 'none' } else { Get-CoreExceptionLabel $error }
              argument = if ($null -eq $error) { 'none' } else { Get-CoreArgumentLabel $error }
              os = if ($null -eq $error) { 'none' } else { Get-CoreOsErrorLabel $error }
              located = if ($null -eq $error) { 'none' } elseif ($null -eq $error.location) { 'absent' } else { 'present' }
              ruled = if ($null -eq $error) { 'none' } elseif ($null -eq $error.rule_id) { 'absent' } else { 'present' }
              results = $results.Count
              canary = @($results | Where-Object { $_.check_id -in @('config.semgrep.context-relay-scan-canary','context-relay-scan-canary') }).Count
              policy = @($results | Where-Object { $_.check_id -in @('config.semgrep.context-relay-no-python-runtime','context-relay-no-python-runtime') }).Count
              scanned = @($report.paths.scanned).Count
              timed = @($report.time.targets).Count
              stderr = if ((Get-Item $stderr).Length -eq 0) { 'empty' } else { 'present' }
            }
          }
          $clean = Invoke-CoreProbe "osemgrep`ncontext-relay-scan-canary"
          $finding = Invoke-CoreProbe "python.exe`ncontext-relay-scan-canary"
          Write-Host "context-relay-semgrep-core-probe=$([ordered]@{ clean = $clean; finding = $finding } | ConvertTo-Json -Compress -Depth 4)"
          Remove-Item -LiteralPath $core
