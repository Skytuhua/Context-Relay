name: Publish qualified Windows preview

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful main-branch Windows installer candidate run
        required: true
        type: string
      source_commit:
        description: Accepted full source SHA (also named by the existing protected release tag)
        required: true
        type: string
      installer_sha256:
        description: SHA-256 of the installed and hosted-qualified unsigned installer
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-preview-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    environment: windows-preview-publication
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      INSTALLER_SHA256: ${{ inputs.installer_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - name: Download exact candidate
        shell: pwsh
        run: |
          if ($env:CANDIDATE_RUN_ID -notmatch '^[1-9][0-9]*$') { throw 'Invalid candidate run ID' }
          if ($env:SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$') { throw 'Invalid source SHA' }
          gh run download $env:CANDIDATE_RUN_ID --repo Skytuhua/Context-Relay --name "context-relay-windows-x64-$env:SOURCE_COMMIT" --dir candidate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify candidate bytes, origin and protected tag
        run: node scripts/windows-preview.mjs verify-publication candidate
      - name: Publish accepted bytes without rebuilding
        shell: pwsh
        run: |
          gh release create v0.1.1-alpha.1 --repo Skytuhua/Context-Relay --verify-tag --prerelease --title "Context Relay 0.1.1 — Windows Preview" --notes-file docs/releases/v0.1.1-alpha.1.md "candidate/Context Relay_0.1.1_x64-setup.exe" candidate/SHA256SUMS candidate/provenance.json candidate/sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
