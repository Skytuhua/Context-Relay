name: Supabase

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/check-supabase-contract.mjs'
      - 'scripts/tests/check-supabase-contract.test.mjs'
      - 'scripts/verify-supabase-realtime.mjs'
      - 'scripts/tests/verify-supabase-realtime.test.mjs'
      - 'scripts/tests/supabase-sync-*.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/supabase.yml'
  push:
    paths:
      - 'supabase/**'
      - 'scripts/check-supabase-contract.mjs'
      - 'scripts/tests/check-supabase-contract.test.mjs'
      - 'scripts/verify-supabase-realtime.mjs'
      - 'scripts/tests/verify-supabase-realtime.test.mjs'
      - 'scripts/tests/supabase-sync-*.test.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/supabase.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_AUTH_GITHUB_CLIENT_ID: local-ci-client-id
      SUPABASE_AUTH_GITHUB_SECRET: local-ci-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.9.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:supabase
      - run: node --test scripts/tests/check-supabase-contract.test.mjs
      - run: node --test scripts/tests/verify-supabase-realtime.test.mjs
      - run: node --test scripts/tests/supabase-sync-*.test.mjs
      - run: pnpm supabase:start:ci
      - run: pnpm supabase:reset
      - run: pnpm supabase:test
      - run: pnpm supabase:lint
      - if: always()
        run: pnpm supabase:stop
