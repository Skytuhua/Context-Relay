[package]
name = "context-relay-desktop"
description = "Context Relay desktop shell"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
context-relay-local-ipc = { version = "0.1.0", path = "../../../crates/local-ipc" }
context-relay-protocol = { version = "0.1.0", path = "../../../crates/protocol" }
serde.workspace = true
tauri = { version = "2.8.5", features = [] }
tauri-plugin-dialog = "2"
tokio.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
context-relay-local-ipc = { version = "0.1.0", path = "../../../crates/local-ipc", features = ["test-support"] }
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibilityProtocols", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSResponder", "NSSecureTextField", "NSTextField", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSGeometry", "NSString"] }
