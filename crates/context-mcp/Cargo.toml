[package]
name = "context-relay-context-mcp"
description = "Context Relay MCP shell"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
test-support = [
  "context-relay-local-ipc/test-support",
  "dep:context-relay-contextd",
  "context-relay-contextd/test-support",
]

[dependencies]
context-relay-contextd = { version = "0.1.0", path = "../contextd", optional = true }
context-relay-local-ipc = { version = "0.1.0", path = "../local-ipc" }
context-relay-protocol = { version = "0.1.0", path = "../protocol" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std"] }
uuid.workspace = true

[dev-dependencies]
context-relay-core = { version = "0.1.0", path = "../core" }
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
