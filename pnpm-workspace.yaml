packages:
  - apps/*

allowBuilds:
  esbuild: true

overrides:
  'brace-expansion@1.1.16': '1.1.18'
  'brace-expansion@2.1.2': '2.1.4'
  'esbuild@0.27.7': '0.28.1'
  'browserslist@4.28.6': '4.28.7'
  # Was pinned to 3.1.6, which is affected by GHSA-58mr-gqgx-xq4g (authority
  # injection) and GHSA-wcr8-5c75-vf4h (host confusion). ajv allows ^3.0.1, so
  # 3.1.8 is a patch bump inside the range ajv already permits.
  'fast-uri@3.1.3': '3.1.8'
  'js-yaml@4.3.0': '4.3.2'
  'nanoid@3.3.16': '3.3.18'
  'postcss@8.5.19': '8.5.23'
